<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebGPU Black Hole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    #splash-container { position: relative; width: 100vw; height: 100vh; }
    canvas { display: block; width: 100%; height: 100%; opacity: 0; transform: scale(0.95); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div id="splash-container"></div>
  
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.webgpu.min.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.webgpu.min.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.tsl.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
    }
  }
  </script>
  
  <script type="module">
import * as THREE from 'three/webgpu';
import { pass, uniform, Fn, Loop, Break, If, screenUV, vec2, vec3, vec4, float, length, normalize, cross, dot, sin, cos, atan, asin, sqrt, pow, fract, clamp, smoothstep, mix, floor, step, sign } from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';

// Reduced Lensing by 30%, Disabled Stars & Nebula for solid black space
const config = {
  blackHoleMass: 0.28, diskInnerRadius: 4.1, diskOuterRadius: 14.5, diskTemperature: 49.78, temperatureFalloff: 5.22, diskBrightness: 5, diskRotationSpeed: -8.7, turbulenceScale: 1.81, turbulenceStretch: 0.75, turbulenceSharpness: 7.4, turbulenceCycleTime: 5, turbulenceLacunarity: 2.5, turbulencePersistence: 0.8, diskEdgeSoftnessInner: 0.18, diskEdgeSoftnessOuter: 0.5, gravitationalLensing: 1.68, dopplerStrength: 1.0, stepSize: 1, 
  starsEnabled: false, starBackgroundColor: '#000000', nebulaEnabled: false, bloomStrength: 0.68, bloomRadius: 0, bloomThreshold: 0.45
};

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const container = document.getElementById('splash-container');

// TSL Shader Utilities
const hash21 = Fn(([p]) => fract(sin(dot(p, vec2(127.1, 311.7))).mul(43758.5453)));
const hash31 = Fn(([p]) => fract(sin(dot(p, vec3(127.1, 311.7, 74.7))).mul(43758.5453)));
const noise3D = Fn(([p]) => {
  const i = floor(p), f = fract(p), u = f.mul(f).mul(float(3.0).sub(f.mul(2.0)));
  const a = hash31(i), b = hash31(i.add(vec3(1, 0, 0))), c = hash31(i.add(vec3(0, 1, 0))), d = hash31(i.add(vec3(1, 1, 0)));
  const e = hash31(i.add(vec3(0, 0, 1))), f2 = hash31(i.add(vec3(1, 0, 1))), g = hash31(i.add(vec3(0, 1, 1))), h = hash31(i.add(vec3(1, 1, 1)));
  return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, f2, u.x), mix(g, h, u.x), u.y), u.z);
});
const fbm = Fn(([p, lacunarity, persistence]) => {
  const value = float(0.0).toVar(), amplitude = float(0.5).toVar(), pos = p.toVar();
  value.addAssign(noise3D(pos).mul(amplitude)); pos.mulAssign(lacunarity); amplitude.mulAssign(persistence);
  value.addAssign(noise3D(pos).mul(amplitude)); pos.mulAssign(lacunarity); amplitude.mulAssign(persistence);
  value.addAssign(noise3D(pos).mul(amplitude)); pos.mulAssign(lacunarity); amplitude.mulAssign(persistence);
  value.addAssign(noise3D(pos).mul(amplitude)); return value;
});
const blackbodyColor = Fn(([tempK]) => {
  const t = clamp(tempK.sub(1000.0).div(9000.0), float(0.0), float(1.0));
  const red = clamp(float(1.0).sub(t.sub(0.8).mul(2.0)), float(0.5), float(1.0));
  const green = smoothstep(float(0.0), float(0.5), t).mul(float(1.0).sub(t.sub(0.7).mul(0.3).max(0.0)));
  const blue = smoothstep(float(0.3), float(1.0), t).mul(t);
  return vec3(red, green, blue);
});

const uniforms = {
  blackHoleMass: uniform(config.blackHoleMass), diskInnerRadius: uniform(config.diskInnerRadius), diskOuterRadius: uniform(config.diskOuterRadius), diskTemperature: uniform(config.diskTemperature), temperatureFalloff: uniform(config.temperatureFalloff), diskBrightness: uniform(config.diskBrightness), diskRotationSpeed: uniform(config.diskRotationSpeed), turbulenceScale: uniform(config.turbulenceScale), turbulenceStretch: uniform(config.turbulenceStretch), turbulenceSharpness: uniform(config.turbulenceSharpness), turbulenceCycleTime: uniform(config.turbulenceCycleTime), turbulenceLacunarity: uniform(config.turbulenceLacunarity), turbulencePersistence: uniform(config.turbulencePersistence), diskEdgeSoftnessInner: uniform(config.diskEdgeSoftnessInner), diskEdgeSoftnessOuter: uniform(config.diskEdgeSoftnessOuter), gravitationalLensing: uniform(config.gravitationalLensing), dopplerStrength: uniform(config.dopplerStrength), stepSize: uniform(config.stepSize), starBackgroundColor: uniform(new THREE.Color(config.starBackgroundColor)), time: uniform(0), resolution: uniform(new THREE.Vector2(window.innerWidth, window.innerHeight)), cameraPosition: uniform(new THREE.Vector3(0, 5, 20)), cameraTarget: uniform(new THREE.Vector3(0, 0, 0))
};

const accretionDiskColor = Fn(([hitR, hitAngle, time, rayDir]) => {
  const innerR = uniforms.diskInnerRadius, outerR = uniforms.diskOuterRadius;
  const normR = clamp(hitR.sub(innerR).div(outerR.sub(innerR)), float(0.0), float(1.0));
  const peakTempK = uniforms.diskTemperature.mul(1000.0), outerTempK = float(1500.0);
  const tempK = mix(outerTempK, peakTempK, pow(innerR.div(hitR), uniforms.temperatureFalloff));
  const diskColor = blackbodyColor(tempK).toVar('diskColor');

  const rotationSign = sign(uniforms.diskRotationSpeed);
  const velocityDir = vec3(sin(hitAngle).negate().mul(rotationSign), float(0.0), cos(hitAngle).mul(rotationSign));
  const beta = float(1.0).div(sqrt(hitR.div(innerR))).mul(0.3);
  const dopplerFactor = float(1.0).div(float(1.0).sub(beta.mul(dot(velocityDir, rayDir))));
  diskColor.mulAssign(clamp(pow(dopplerFactor, float(3.0).mul(uniforms.dopplerStrength)), float(0.1), float(5.0)));

  const edgeFalloff = smoothstep(float(0.0), uniforms.diskEdgeSoftnessInner, normR).mul(smoothstep(float(1.0), float(1.0).sub(uniforms.diskEdgeSoftnessOuter), normR));
  const cycleLength = uniforms.turbulenceCycleTime, cyclicTime = time.mod(cycleLength), blendFactor = cyclicTime.div(cycleLength);
  const keplerianPhase1 = cyclicTime.mul(uniforms.diskRotationSpeed).div(pow(hitR, float(1.5))), keplerianPhase2 = cyclicTime.add(cycleLength).mul(uniforms.diskRotationSpeed).div(pow(hitR, float(1.5)));
  const rotatedAngle1 = hitAngle.add(keplerianPhase1), rotatedAngle2 = hitAngle.add(keplerianPhase2);
  const noiseCoord1 = vec3(hitR.mul(uniforms.turbulenceScale), cos(rotatedAngle1).div(uniforms.turbulenceStretch.max(0.1)), sin(rotatedAngle1).div(uniforms.turbulenceStretch.max(0.1)));
  const noiseCoord2 = vec3(hitR.mul(uniforms.turbulenceScale), cos(rotatedAngle2).div(uniforms.turbulenceStretch.max(0.1)), sin(rotatedAngle2).div(uniforms.turbulenceStretch.max(0.1)));
  const turbulence = mix(fbm(noiseCoord2, uniforms.turbulenceLacunarity, uniforms.turbulencePersistence), fbm(noiseCoord1, uniforms.turbulenceLacunarity, uniforms.turbulencePersistence), blendFactor);
  const ringOpacity = pow(clamp(turbulence, float(0.0), float(1.0)), uniforms.turbulenceSharpness);

  return vec4(diskColor.mul(uniforms.diskBrightness), ringOpacity.mul(edgeFalloff));
});

const blackHoleShader = Fn(() => {
  const rs = uniforms.blackHoleMass.mul(2.0), uv = screenUV.sub(0.5).mul(2.0);
  const screenPos = vec2(uv.x.mul(uniforms.resolution.x.div(uniforms.resolution.y)), uv.y);
  const camPos = uniforms.cameraPosition, camForward = normalize(uniforms.cameraTarget.sub(camPos));
  const camRight = normalize(cross(vec3(0.0, 1.0, 0.0), camForward)), camUp = cross(camForward, camRight);

  const rayDir = normalize(camForward.add(camRight.mul(screenPos.x)).add(camUp.mul(screenPos.y))).toVar('rayDir');
  const rayPos = camPos.toVar('rayPos'), prevPos = camPos.toVar('prevPos');
  const color = vec3(0.0).toVar('color'), alpha = float(0.0).toVar('alpha'), escaped = float(0.0).toVar('escaped'), captured = float(0.0).toVar('captured');

  Loop(200, () => {
    If(escaped.greaterThan(0.5).or(captured.greaterThan(0.5)).or(alpha.greaterThan(0.99)), () => { Break(); });
    const r = length(rayPos);
    If(r.lessThan(rs.mul(1.01)), () => { captured.assign(1.0); Break(); });
    If(r.greaterThan(250.0), () => { escaped.assign(1.0); Break(); });

    rayDir.addAssign(rayPos.negate().div(r).mul(rs.div(r.mul(r)).mul(uniforms.stepSize).mul(uniforms.gravitationalLensing)));
    rayDir.assign(normalize(rayDir));
    prevPos.assign(rayPos);
    rayPos.addAssign(rayDir.mul(uniforms.stepSize));

    If(prevPos.y.mul(rayPos.y).lessThan(0.0).and(alpha.lessThan(0.99)), () => {
      const hitPos = mix(prevPos, rayPos, prevPos.y.negate().div(rayPos.y.sub(prevPos.y)));
      const hitR = sqrt(hitPos.x.mul(hitPos.x).add(hitPos.z.mul(hitPos.z)));
      
      If(hitR.greaterThan(float(config.diskInnerRadius)).and(hitR.lessThan(float(config.diskOuterRadius))), () => {
        const diskResult = accretionDiskColor(hitR, atan(hitPos.z, hitPos.x), uniforms.time, rayDir);
        const remainingAlpha = float(1.0).sub(alpha);
        color.addAssign(diskResult.xyz.mul(diskResult.w).mul(remainingAlpha));
        alpha.addAssign(remainingAlpha.mul(diskResult.w));
      });
    });
  });

  If(captured.lessThan(0.5), () => { escaped.assign(1.0); });
  If(escaped.greaterThan(0.5).and(alpha.lessThan(0.99)), () => {
    color.addAssign(uniforms.starBackgroundColor.mul(float(1.0).sub(alpha)));
  });

  return vec4(pow(color, vec3(1.0 / 2.2)), 1.0);
});

const scene = new THREE.Scene();
const cameraGroup = new THREE.Group();
scene.add(cameraGroup);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
cameraGroup.add(camera);

// 10-degree Z-tilt (Roll)
const tiltAngle = 10 * (Math.PI / 180);
cameraGroup.up.set(Math.sin(tiltAngle), Math.cos(tiltAngle), 0);

function getCalculatedZDistance() {
  const vFOV = camera.fov * Math.PI / 180;
  const isMobile = window.innerWidth <= 768;
  const objectSize = 29; 
  if (isMobile) return -(objectSize / (0.40 * 2 * Math.tan(vFOV / 2))); 
  return -(objectSize / (0.30 * 2 * Math.tan(vFOV / 2) * camera.aspect)); 
}

function getCalculatedYDistance(zDistance) {
  return Math.abs(zDistance) * Math.tan(12 * (Math.PI / 180));
}

const startZ = -150;
const targetZ = getCalculatedZDistance();

if (prefersReducedMotion) {
  cameraGroup.position.set(0, getCalculatedYDistance(targetZ), targetZ);
} else {
  cameraGroup.position.set(0, getCalculatedYDistance(startZ), startZ);
}
cameraGroup.lookAt(0, 0, 0);

const renderer = new THREE.WebGPURenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

const geometry = new THREE.SphereGeometry(150, 32, 32); 
geometry.scale(-1, 1, 1); 
const material = new THREE.MeshBasicNodeMaterial();
material.colorNode = blackHoleShader(); 
const mesh = new THREE.Mesh(geometry, material);
mesh.frustumCulled = false;
scene.add(mesh);

let targetX = 0, targetY = 0, mouseX = 0, mouseY = 0;
window.addEventListener('mousemove', (e) => {
  targetX = (e.clientX / window.innerWidth) * 2 - 1;
  targetY = -(e.clientY / window.innerHeight) * 2 + 1;
});

let postProcessing = null, lastFrameTime = performance.now();

function updateCamera() {
  const worldPos = new THREE.Vector3();
  camera.getWorldPosition(worldPos);
  uniforms.cameraPosition.value.copy(worldPos);
  
  const worldDir = new THREE.Vector3();
  camera.getWorldDirection(worldDir);
  uniforms.cameraTarget.value.copy(worldPos.clone().add(worldDir.multiplyScalar(10)));
}

function animate() {
  requestAnimationFrame(animate);
  const currentTime = performance.now(), deltaTime = Math.min((currentTime - lastFrameTime) / 1000, 0.033);
  lastFrameTime = currentTime;
  
  if (!prefersReducedMotion) uniforms.time.value += deltaTime;
  
  mouseX += (targetX - mouseX) * 0.05;
  mouseY += (targetY - mouseY) * 0.05;
  camera.position.x = mouseX * 2.5; 
  camera.position.y = mouseY * 2.5;
  
  updateCamera();
  if (postProcessing) postProcessing.render(); else renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight); uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
  
  const newTargetZ = getCalculatedZDistance();
  gsap.to(cameraGroup.position, { 
    z: newTargetZ, 
    y: getCalculatedYDistance(newTargetZ), 
    duration: 0.5, ease: "power1.out", 
    onUpdate: () => cameraGroup.lookAt(0, 0, 0)
  });
});

renderer.init().then(() => {
  postProcessing = new THREE.PostProcessing(renderer);
  const scenePass = pass(scene, camera), scenePassColor = scenePass.getTextureNode(), bloomPass = bloom(scenePassColor);
  bloomPass.threshold.value = config.bloomThreshold; bloomPass.strength.value = config.bloomStrength; bloomPass.radius.value = config.bloomRadius;
  postProcessing.outputNode = scenePassColor.add(bloomPass);
  
  if (prefersReducedMotion) {
    gsap.to(renderer.domElement, { opacity: 1, scale: 1, duration: 4.5, ease: "power2.out" });
  } else {
    gsap.to(renderer.domElement, { opacity: 1, scale: 1, duration: 2, ease: "power2.out" });
    gsap.to(cameraGroup.position, { 
      z: targetZ, 
      y: getCalculatedYDistance(targetZ), 
      duration: 5.5, 
      ease: "power2.out", 
      onUpdate: () => cameraGroup.lookAt(0, 0, 0)
    });
  }
  
  animate();
}).catch(err => {
  console.error('WebGPU init failed:', err);
  container.innerHTML = '<div style="color:#fff;padding:20px;text-align:center;"><h1>WebGPU Not Supported</h1><p>Chrome 113+ or Edge 113+ required.</p></div>';
});
  </script>
</body>
</html>
